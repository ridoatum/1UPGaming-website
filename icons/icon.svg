<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#0a0a1a"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a855f7"/>
      <stop offset="100%" style="stop-color:#3b82f6"/>
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="256" cy="256" r="256" fill="url(#bg)"/>
  <!-- Controller body -->
  <rect x="96" y="176" width="320" height="192" rx="96" ry="96" fill="url(#glow)" opacity="0.9"/>
  <!-- D-pad left stick area -->
  <circle cx="176" cy="272" r="32" fill="#0a0a1a" opacity="0.7"/>
  <!-- Buttons area -->
  <circle cx="336" cy="272" r="32" fill="#0a0a1a" opacity="0.7"/>
  <!-- Select / Start buttons -->
  <rect x="228" y="264" width="20" height="12" rx="6" fill="#0a0a1a" opacity="0.8"/>
  <rect x="264" y="264" width="20" height="12" rx="6" fill="#0a0a1a" opacity="0.8"/>
  <!-- Left grip handle -->
  <ellipse cx="160" cy="340" rx="44" ry="52" fill="url(#glow)" opacity="0.9"/>
  <!-- Right grip handle -->
  <ellipse cx="352" cy="340" rx="44" ry="52" fill="url(#glow)" opacity="0.9"/>
  <!-- 1UP text -->
  <text x="256" y="270" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="52" fill="white" text-anchor="middle" dominant-baseline="middle" letter-spacing="2">1UP</text>
</svg>
